name: Service route browser test

on:
  push:
    branches:
      - fix/service-pages-runtime-error
  pull_request:
    branches:
      - main

jobs:
  service-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Verify service routes render without browser errors
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const routes = ['/websites', '/branding', '/seo', '/digital-marketing', '/personvern'];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          for (const route of routes) {
            errors.length = 0;
            const response = await page.goto('http://127.0.0.1:5173' + route, { waitUntil: 'networkidle' });
            const heading = await page.locator('main h1').first().textContent().catch(() => '');
            if (!response || !response.ok()) throw new Error(`${route}: HTTP ${response?.status()}`);
            if (!heading?.trim()) throw new Error(`${route}: missing main H1`);
            if (errors.length) throw new Error(`${route}: browser errors: ${errors.join('; ')}`);
            console.log(`PASS ${route}: ${heading.trim()}`);
          }
          for (const width of [390, 1440]) {
            await page.setViewportSize({ width, height: 900 });
            await page.goto('http://127.0.0.1:5173/personvern', { waitUntil: 'networkidle' });
            if (await page.locator('main h1').textContent() !== 'Personvern') throw new Error('Privacy route fell back to home');
            if (await page.title() !== 'Personvern | Cidea Marketing') throw new Error('Missing privacy title');
            if (await page.locator('meta[name="robots"]').getAttribute('content') !== 'noindex') throw new Error('Draft must remain noindex');
            if (await page.locator('footer a[href="/personvern"]').count() !== 1) throw new Error('Missing footer link');
            if (!await page.locator('main a[href="mailto:jelassi@cideamarketing.com"]').count()) throw new Error('Missing monitored contact');
            if (await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth)) throw new Error('Horizontal overflow at ' + width);
            console.log('PASS privacy draft at ' + width);
          }
          await browser.close();
          EOF
