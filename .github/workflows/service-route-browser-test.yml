name: Service route browser test

on:
  push:
    branches:
      - fix/service-pages-runtime-error
  pull_request:
    branches:
      - main

jobs:
  service-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Verify service routes render without browser errors
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const baseUrl = 'http://127.0.0.1:5173';
          const routes = ['/websites', '/branding', '/seo', '/digital-marketing'];
          const article = '/blog/hva-bor-en-god-bedriftsnettside-inneholde';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));

          async function visit(path) {
            errors.length = 0;
            const response = await page.goto(baseUrl + path, { waitUntil: 'networkidle' });
            if (!response || !response.ok()) throw new Error(`${path}: HTTP ${response?.status()}`);
            const heading = await page.locator('main h1').first().textContent().catch(() => '');
            if (!heading?.trim()) throw new Error(`${path}: missing main H1`);
            if (errors.length) throw new Error(`${path}: browser errors: ${errors.join('; ')}`);
            return heading.trim();
          }

          for (const route of routes) {
            console.log(`PASS ${route}: ${await visit(route)}`);
          }

          await page.goto(baseUrl + '/', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'Åpne meny' }).click();
          if (!await page.getByRole('navigation').getByRole('link', { name: 'Nettsider' }).isVisible()) {
            throw new Error('Mobile menu did not open or service links are not visible');
          }
          await page.getByRole('navigation').getByRole('link', { name: 'Nettsider' }).click();
          if (await page.getByRole('navigation').isVisible()) {
            throw new Error('Mobile menu remained visible after choosing a route');
          }
          console.log('PASS mobile navigation opens and closes after selecting a route');

          await page.goto(baseUrl + '/', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'EN' }).click();
          await page.waitForFunction(() => document.title.startsWith('Cidea Marketing — Make your business'));
          if ((await page.locator('body').innerText()).includes('Nettsider')) {
            throw new Error('Norwegian homepage text remains after switching to English');
          }
          await page.reload({ waitUntil: 'networkidle' });
          if (!await page.getByRole('button', { name: 'NO' }).isVisible()) {
            throw new Error('English language preference did not persist after reload');
          }
          console.log('PASS language switch and persisted preference');

          await page.goto(baseUrl + article, { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'NO' }).click();
          await page.waitForFunction(() => document.title.includes('Hva bør en god bedriftsnettside'));
          const norwegianTitle = await page.title();
          const norwegianDescription = await page.locator('meta[name="description"]').getAttribute('content');
          if (!norwegianDescription?.includes('En god bedriftsnettside')) {
            throw new Error('Norwegian article description is missing or incorrect');
          }
          await page.getByRole('button', { name: 'EN' }).click();
          await page.waitForFunction(() => document.title.includes('What should a good business website'));
          const englishDescription = await page.locator('meta[name="description"]').getAttribute('content');
          if (!englishDescription?.includes('A good business website')) {
            throw new Error('English article description is missing or incorrect');
          }
          if (norwegianTitle === await page.title()) {
            throw new Error('Article title did not change with language');
          }
          console.log('PASS article title and description follow the selected language');

          await browser.close();
          EOF
