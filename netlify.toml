# Alle sider er forhåndsrendret til egne filer i dist (scripts/prerender.mjs), så direktelenker og oppdatering
# fungerer uten omskriving. Ukjente stier får dist/404.html, som Netlify serverer med status 404.
# Kontaktskjemaet bruker Netlify Forms (skjemaet «kontakt» i dist/kontakt/index.html). Skjemaregistrering og
# e-postvarsel må slås på i Netlify (Forms) før mottak kan testes; se docs/cinematic-pilot/phase6/README.md.
# Byggeinnstillingene (kommando og publiseringsmappe) ligger uendret i Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# Internasjonalisering (oktober 2026), se docs/internasjonal/URL-STRATEGI.md. Ingen eksisterende adresse flyttes:
# norske undersider beholder sine adresser, og / er nå engelsk forside (norsk forside: /no). Reglene under fanger bare
# opp adresser besøkende kan gjette seg til. Ingen omdirigering basert på IP-adresse eller nettleserspråk.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/uae"
  to = "/dubai"
  status = 301
[[redirects]]
  from = "/no/*"
  to = "/:splat"
  status = 301
